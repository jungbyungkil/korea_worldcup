services:
  # ── 1. FastAPI 백엔드 (Web Service) ──────────────────────────────────────────
  - type: web
    name: korea-worldcup-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      # API 키 — Render 대시보드에서 직접 입력 (sync: false = 값 없이 키 이름만 등록)
      - key: API_FOOTBALL_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # 아래는 기본값 그대로 사용 (필요 시 대시보드에서 덮어쓰기)
      - key: API_FOOTBALL_BASE_URL
        value: https://v3.football.api-sports.io
      - key: OPENAI_BASE_URL
        value: https://api.openai.com/v1
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: API_FOOTBALL_INJURY_SEASON
        value: "2025"
      - key: API_FOOTBALL_PLAYER_FEATURE_LIMIT
        value: "26"
      - key: API_FOOTBALL_PLAYER_INCLUDE_CLUB_STATS
        value: "true"
      - key: API_FOOTBALL_PLAYER_INCLUDE_LINEUPS
        value: "false"
      - key: API_FOOTBALL_PLAYER_FEATURES_CACHE_SEC
        value: "300"
      - key: API_FOOTBALL_MEXICO_INCLUDE_CLUB_STATS
        value: "true"
      - key: API_FOOTBALL_MEXICO_FEATURES_CACHE_SEC
        value: "300"
      - key: API_FOOTBALL_SOUTH_AFRICA_INCLUDE_CLUB_STATS
        value: "true"
      - key: API_FOOTBALL_SOUTH_AFRICA_FEATURES_CACHE_SEC
        value: "300"
      - key: API_FOOTBALL_CZECH_REPUBLIC_INCLUDE_CLUB_STATS
        value: "true"
      - key: API_FOOTBALL_CZECH_REPUBLIC_FEATURES_CACHE_SEC
        value: "300"

  # ── 2. Vite 프론트엔드 (Static Site) ─────────────────────────────────────────
  - type: static
    name: korea-worldcup-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    plan: free
    envVars:
      # 빌드 시 백엔드 URL을 주입 — 백엔드 서비스의 RENDER_EXTERNAL_URL(https://...onrender.com)을 복사
      - key: VITE_API_BASE_URL
        fromService:
          name: korea-worldcup-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
